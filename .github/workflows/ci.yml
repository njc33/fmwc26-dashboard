name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f savantfantasydashboard/requirements.txt ]; then
            pip install -r savantfantasydashboard/requirements.txt
          fi

      - name: Lint with flake8
        run: |
          # Fail on syntax errors or undefined names
          flake8 savantfantasydashboard/ \
            --count --select=E9,F63,F7,F82 \
            --show-source --statistics
          # Warn on style issues (non-blocking)
          flake8 savantfantasydashboard/ \
            --count --exit-zero \
            --max-line-length=100 --statistics

      - name: Syntax smoke test
        run: |
          python -c "
          import ast
          with open('savantfantasydashboard/scripts/fetch_data_from_apis.py') as f:
              ast.parse(f.read())
          print('Syntax OK')
          "
