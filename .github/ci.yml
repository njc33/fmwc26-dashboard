name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          EMBED_MCWS: "https://example.com/mcws"
          EMBED_FIFA: "https://example.com/fifa"
          EMBED_FUTURE_GMS: "https://example.com/fgms"
          EMBED_NAFFL: "https://example.com/naffl"
        run: pytest tests/ -v
